name: Trigger auto deployment for sportwebcontainer

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ sport-web ]
    paths:
    - '**'
    - '.github/workflows/sportwebcontainer-AutoDeployTrigger-d733b999-04f9-4cfb-a69f-116d0165fae2.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SPORTWEBCONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SPORTWEBCONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SPORTWEBCONTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.SPORTWEBCONTAINER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SPORTWEBCONTAINER_REGISTRY_PASSWORD }}
          containerAppName: sportwebcontainer
          resourceGroup: SMS-Resource-Group
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


